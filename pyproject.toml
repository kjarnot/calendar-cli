[project]
name = "calendar-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin Jarnot", email = "7809688+kjarnot@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "msal>=1.39.0",
    "pydantic>=2.14.1",
    "python-dateutil>=3.0.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
calendar-cli = "calendar_cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
